<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex">
  <title>music is magic — broadcast</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M10 50 Q50 22 90 50' fill='none' stroke='%238d80b8' stroke-width='7' stroke-linecap='round'/%3E%3Cpath d='M10 50 Q50 72 90 50' fill='none' stroke='%238d80b8' stroke-width='7' stroke-linecap='round'/%3E%3Ccircle cx='50' cy='49' r='13' fill='%238d80b8'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/portal.css">
  <style>
    /* Everything below is operator furniture. It must be capable of vanishing
       completely, because in window-capture mode this page IS the broadcast
       frame — anything still on screen is on the stream. The HUD fades after
       a few idle seconds, `h` toggles it, and ?hud=0 never shows it at all. */

    #hud {
      position: fixed;
      inset: auto auto 0 0;
      margin: 0.9rem;
      padding: 0.7rem 0.9rem;
      display: grid;
      gap: 0.55rem;
      font: 0.78rem/1.35 system-ui, sans-serif;
      color: #cfc9e0;
      background: rgba(8, 9, 16, 0.82);
      border: 1px solid #2a2540;
      border-radius: 0.6rem;
      max-width: min(23rem, calc(100vw - 2rem));
      opacity: 1;
      transition: opacity 0.8s ease;
      z-index: 10;
    }
    body.idle #hud { opacity: 0; pointer-events: none; }
    body.idle { cursor: none; }
    #hud[hidden] { display: none; }

    #hud .rows { display: grid; gap: 0.2rem; }
    #hud .row { display: flex; gap: 0.5rem; align-items: baseline; }
    #hud .k { opacity: 0.5; min-width: 4.3rem; }
    #hud .v { font-variant-numeric: tabular-nums; }
    #hud .v.warn { color: #d8a657; }
    #hud .v.bad { color: #d97070; }
    #hud .v.good { color: #8fbf6f; }

    #meter {
      height: 0.28rem;
      background: #241f38;
      border-radius: 1rem;
      overflow: hidden;
    }
    #meterFill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6f7fae, #8fbf6f);
      transition: width 0.09s linear;
    }

    #hud .btns { display: flex; flex-wrap: wrap; gap: 0.35rem; }
    #hud button {
      font: inherit;
      padding: 0.34rem 0.6rem;
      border-radius: 0.4rem;
      border: 1px solid #35304a;
      background: #14121f;
      color: #cfc9e0;
      cursor: pointer;
    }
    #hud button:hover { background: #201b32; }
    #hud button.on { border-color: #8d80b8; background: #241f38; }
    #hud .hint { opacity: 0.4; font-size: 0.72rem; }

    /* The arming gate. Browsers need one user gesture before an AudioContext
       may run, and the microphone prompt wants one too. It covers the frame
       so it cannot be missed, and removes itself for good once satisfied. */
    #arm {
      position: fixed;
      inset: 0;
      display: grid;
      place-content: center;
      gap: 0.8rem;
      justify-items: center;
      background: rgba(5, 6, 10, 0.94);
      color: #cfc9e0;
      font: 1rem/1.5 system-ui, sans-serif;
      text-align: center;
      cursor: pointer;
      z-index: 20;
    }
    #arm[hidden] { display: none; }
    #arm strong { font-weight: 600; letter-spacing: 0.06em; }
    #arm span { opacity: 0.55; font-size: 0.85rem; max-width: 24rem; }
  </style>
</head>
<body data-eye="sealed">
  <canvas id="viz" aria-hidden="true"></canvas>
  <canvas id="eye" aria-hidden="true"></canvas>

  <div id="arm">
    <strong>click to arm</strong>
    <span>Grants microphone access and starts the audio clock. Do this before
      you go live — the frame is not capturable until it is armed.</span>
  </div>

  <div id="hud">
    <div class="rows">
      <div class="row"><span class="k">eye</span><span class="v" id="hEye">sealed</span></div>
      <div class="row"><span class="k">mood</span><span class="v" id="hTheme">default</span></div>
      <div class="row"><span class="k">audio</span><span class="v" id="hAudio">not armed</span></div>
      <div class="row"><span class="k">control</span><span class="v" id="hRelay">—</span></div>
      <div class="row"><span class="k">render</span><span class="v" id="hViz">—</span></div>
    </div>
    <div id="meter"><div id="meterFill"></div></div>
    <div class="btns">
      <button id="bWake">wake</button>
      <button id="bSeal">seal</button>
      <select id="devices" hidden></select>
    </div>
    <div class="hint">h hides this · it fades on its own · ?hud=0 never shows it</div>
  </div>

  <script type="module" src="js/broadcast.js"></script>
</body>
</html>
